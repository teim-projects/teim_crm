{% load static%}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>TEIMCRM</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="css/style.css" rel="stylesheet">
  <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
  <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    .form-rowsales {
      margin: 85px 10px 10px 10px !important;
      /* top | right | bottom | left */

    }
  </style>
</head>

<body>
  {% include 'sidebar.html' %}
  <div class="main" style="min-height: 100vh;">

    <div class="container" style="margin-top: 50px;">

      <div class="row">
        <div class="col-md-2"></div>
        <div class="col-md-8  rounded  mt-5 mb-5 pt-3 formshdow">

          <span onclick="window.location.href='/index'"
            style="float: left; cursor: pointer; color:rgb(75, 162, 255); font-size:20px;" class="mb-4"><i
              class="fas fa-house-chimney ml-2 mt-1"></i></span>
          <span onclick="goBackAndRefresh()" style="float: right; cursor: pointer; color:red; font-size:20px;"
            class="mb-4 mr-2 mt-1">X</span>

          <form method="POST" class="p-3" id="branchForm" novalidate>
            {% csrf_token %}
            <h3 class="text-center">Create New Branch</h3>

            <div class="row">
              <div class="mb-3 col-md-6 col-md-6">
                <label>Branch Name <span class="star">*</span></label>
                <input type="text" name="branch_name" class="form-control" required>
              </div>

              <div class="mb-3 col-md-6">
                <label>Contact 1 <span class="star">*</span></label>
                <input type="text" name="contact_1" class="form-control" required maxlength="10" pattern="[0-9]{10}" title="Enter exactly 10 digits" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
              </div>

              <div class="mb-3 col-md-6">
                <label>Contact 2 <span class="star">*</span></label>
                <input type="text" name="contact_2" class="form-control" maxlength="10" pattern="[0-9]{10}" title="Enter exactly 10 digits" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
              </div>

              <div class="mb-3 col-md-6">
                <label>Email 1 <span class="star">*</span></label>
                <input type="email" name="email_1" class="form-control" required>
              </div>

              <div class="mb-3 col-md-6">
                <label>Email 2 <span class="star">*</span></label>
                <input type="email" name="email_2" class="form-control">
              </div>

              <div class="mb-3 col-md-6">
                <label>GST Number <span class="star">*</span></label>
                <input type="text" name="gst_number" class="form-control" required>
              </div>

              <div class="mb-3 col-md-6">
                <label>PAN Number <span class="star">*</span></label>
                <input type="text" name="pan_number" class="form-control" required>
              </div>

              <div class="mb-3  col-md-6 d-flex align-items-top">
                <label class="form-check-label me-2 mb-0" for="id_is_head_office">
                  Is HO Branch?
                </label>
                <input 
                  type="checkbox" 
                  name="is_head_office" 
                  id="id_is_head_office" 
                  class="form-check-input"
                >
              </div>
              


              <div class="container mt-2">
                <!-- Row 1: State Dropdown, Shortcut, Code -->
                <div class="row">
                  <!-- State Dropdown -->
                  <div class="mb-3 col-md-4">
                    <label for="state">State <span class="star">*</span></label>
                    <select id="state" name="state" class="form-control" required>
                      <option value="">-- Select State --</option>
                      {% for state in state_map.keys %}
                      <option value="{{ state }}">{{ state }}</option>
                      {% endfor %}
                    </select>
                  </div>

                  <!-- Shortcut Auto-Fill -->
                  <div class="mb-3 col-md-4">
                    <label>State Shortcut <span class="star">*</span></label>
                    <input type="text" id="shortcut" name="shortcut" class="form-control" readonly required>
                  </div>

                  <!-- Code Auto-Fill -->
                  <div class="mb-3 col-md-4">
                    <label>State Code <span class="star">*</span></label>
                    <input type="text" id="state_code" name="code" class="form-control" readonly required>
                  </div>
                </div>

                <!-- Row 2: Full Address -->
                <div class="row">
                  <div class="mb-3 col-md-12">
                    <label>Full Address <span class="star">*</span></label>
                    <textarea name="full_address" class="form-control" rows="2" required></textarea>
                  </div>
                </div>
              </div>





              <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-3">
                  <a href="{% url 'branch_list' %}" style="text-decoration: none;">
                    <button type="button"
                      class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center"
                      style="transition: all 0.3s;">
                      <i class="bi bi-check-circle me-2 "></i> Veiw Branch
                    </button>
                  </a>
                </div>
                <div class="col-md-3">
                  <button type="submit" class="btn btn-success w-100 d-flex align-items-center justify-content-center"
                    style="transition: all 0.3s;">
                    <i class="bi bi-check-circle me-2 "></i> Create Branch
                  </button>
                </div>
                <div class="col-md-3"></div>

              </div>

            </div>
          </form>



        </div>
        <div class="col-md-2"></div>
      </div>

    </div>

  </div>

  <div class="container-fluid footer  " style="background-color: #f7f7f7; width:100%;">
    <div class="row p-3">
      <div class="col-md-12 text-center">
        <p style="margin: 0; font-weight: 600; word-wrap: break-word;color:#000000">
          © 2025. Powered by
          <img src="{% static 'images/crono.png' %}" alt="Chronoanalytics Logo"
            style="height: 20px; vertical-align: middle;">
          <a href="http://www.chronoanalytics.in/"
            style="text-decoration: none;  background: linear-gradient(to right, #2575fc, #6a11cb);-webkit-background-clip: text;-webkit-text-fill-color: transparent; font-size: 1.1rem;">Chronoanalytics
            Solution</a>
          All Rights Reserved.
        </p>
      </div>
      <div class="col-md-12 text-center">
        <p style="font-weight: 600; word-wrap: break-word;color:#000000 ">
          © 2025. Marketed by
          <img src="{% static 'images/TeimLogo.png' %}" alt="Teim Logo" style="height: 20px; vertical-align: middle;">
          <a href="http://teim.in/" style="text-decoration: none;  background: linear-gradient(to right, #2575fc, #6a11cb); /* Gradient definition */
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; font-size: 1.1rem;">TEIM</a>
          All Rights Reserved.
        </p>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const menuItems = document.querySelectorAll('.sidebar ul li.has-submenu');
      menuItems.forEach(item => {
        item.addEventListener('click', function () {
          const submenu = this.querySelector('.submenu');
          const arrow = this.querySelector('.arrow-down');

          // Hide all other submenus
          menuItems.forEach(otherItem => {
            if (otherItem !== this) {
              const otherSubmenu = otherItem.querySelector('.submenu');
              const otherArrow = otherItem.querySelector('.arrow-down');
              if (otherSubmenu) {
                otherSubmenu.style.display = 'none';
                if (otherArrow.classList.contains('arrow-up')) {
                  otherArrow.classList.remove('arrow-up');
                }
              }
            }
          });

          // Toggle current submenu
          if (submenu) {
            submenu.style.display = (submenu.style.display === 'block' ? 'none' : 'block');
            arrow.classList.toggle('arrow-up');
          }
        });
      });
    });
    const deleteLinks = document.querySelectorAll('.delete-link');
    const confirmationModal = document.getElementById('confirmationModal');
    const confirmDeleteButton = document.getElementById('confirmDeleteButton');
    const cancelDeleteButton = document.getElementById('cancelDeleteButton');
    let deleteUrl = '';

    deleteLinks.forEach(link => {
      link.addEventListener('click', function (event) {
        event.preventDefault();
        deleteUrl = this.getAttribute('href');
        confirmationModal.style.display = 'block';
      });
    });

    confirmDeleteButton.addEventListener('click', function () {
      if (deleteUrl) {
        window.location.href = deleteUrl;
      }
    });

    cancelDeleteButton.addEventListener('click', function () {
      confirmationModal.style.display = 'none';
    });

    window.addEventListener('click', function (event) {
      if (event.target == confirmationModal) {
        confirmationModal.style.display = 'none';
      }
    });

    function openModal(service_id) {
      fetch(`/get_service_details/${service_id}/`)
        .then(response => response.text())
        .then(html => {
          document.getElementById('modal-content').innerHTML = html;
          document.getElementById('modal').classList.add('active');
        });

    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
  </script>

  <!-- This safely embeds state_map -->
  {{ state_map|json_script:"state-data" }}

  <script>
    const stateMap = JSON.parse(document.getElementById('state-data').textContent);

    document.getElementById('state').addEventListener('change', function () {
      const selectedState = this.value;
      const stateData = stateMap[selectedState];

      if (stateData) {
        document.getElementById('shortcut').value = stateData.shortcut;
        document.getElementById('state_code').value = stateData.code;
      } else {
        document.getElementById('shortcut').value = '';
        document.getElementById('state_code').value = '';
      }
    });
  </script>


<script>
/* TEIM-VALIDATION: templates/create_branch.html */

(function(){
  var form = document.getElementById('branchForm');
  if (!form) return;
  form.addEventListener('submit', function(e) {
    var errors = [];
    var bn = form.querySelector('[name="branch_name"]');
    if (bn && !bn.value.trim()) errors.push('Branch Name is required.');
    var c1 = form.querySelector('[name="contact_1"]');
    if (c1) {
      if (!c1.value.trim()) errors.push('Contact 1 is required.');
      else if (!/^[0-9]{10}$/.test(c1.value.trim())) errors.push('Contact 1 must be exactly 10 digits.');
    }
    var c2 = form.querySelector('[name="contact_2"]');
    if (c2 && c2.value.trim() && !/^[0-9]{10}$/.test(c2.value.trim()))
      errors.push('Contact 2 must be exactly 10 digits (or leave blank).');
    var e1 = form.querySelector('[name="email_1"]');
    if (e1 && !e1.value.trim()) errors.push('Email 1 is required.');
    var gst = form.querySelector('[name="gst_number"]');
    if (gst) {
      if (!gst.value.trim()) errors.push('GST Number is required.');
      else if (!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$/.test(gst.value.trim()))
        errors.push('GST Number format is invalid (e.g. 27ABCDE1234F1Z5).');
    }
    var pan = form.querySelector('[name="pan_number"]');
    if (pan) {
      if (!pan.value.trim()) errors.push('PAN Number is required.');
      else if (!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(pan.value.trim()))
        errors.push('PAN Number format is invalid (e.g. ABCDE1234F).');
    }
    var state = form.querySelector('[name="state"]');
    if (state && !state.value) errors.push('Please select a State.');
    var addr = form.querySelector('[name="full_address"]');
    if (addr && !addr.value.trim()) errors.push('Full Address is required.');
    if (errors.length) {
      e.preventDefault();
      showErrors('branchAlertBox', errors, form);
    }
  });
})();

</script>

<script>
function showErrors(boxId, errors, form) {
  var old = document.getElementById(boxId);
  if (old) old.remove();
  var d = document.createElement('div');
  d.id = boxId;
  d.className = 'alert alert-danger mt-2 mb-2';
  d.style.cssText = 'border-left:4px solid #dc3545; background:#fff5f5; padding:12px 16px;';
  d.innerHTML = '<strong style="color:#dc3545">&#9888; Please fix the following:</strong><ul class="mb-0 mt-1" style="padding-left:20px">' +
    errors.map(function(m){ return '<li style="margin-top:4px">' + m + '</li>'; }).join('') + '</ul>';
  form.insertBefore(d, form.firstChild);
  // Scroll the alert into view regardless of scroll container
  setTimeout(function() {
    d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}
</script>
</body>

</html>
