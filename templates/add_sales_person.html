<body>

<div class="main">
  
 <div class="container">
  <div class="row form-rowsales">


    <div class="col-md-8 offset-md-2 shadow bg-white  rounded  p-2">
           <span onclick="window.location.href='/index'"
                    style="float: left; cursor: pointer; color:rgb(75, 162, 255); font-size:20px;" class="mb-4"><i
                        class="fas fa-house-chimney ml-2 mt-1"></i></span>
                <span onclick="goBackAndRefresh()" style="float: right; cursor: pointer; color:red; font-size:20px;"
                    class="mb-4 mr-2 mt-1">X</span>
      <form method="post" class="p-3" id="spForm" novalidate>
        {% csrf_token %}
        
        <div class="row">
              <div class="col-md-12">
      <h3 class="text-center text-dark ">Add Sales Person</h3>
    </div>
          <div class="col-md-6 mb-3">
            <label>Full Name <span class="star">*</span></label>
            <input type="text" name="full_name" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Date of Joining <span class="star">*</span></label>
            <input type="date" name="date_of_joining" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Mobile No <span class="star">*</span></label>
            <input type="text" class="form-control" name="mobile_no" required maxlength="10" pattern="[0-9]{10}" title="Enter exactly 10 digits" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
          </div>
          <div class="col-md-6 mb-3">
            <label>Email <span class="star">*</span></label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Password <span class="star">*</span></label>
            <input type="password" class="form-control" name="password" placeholder="Password" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Branch <span class="star">*</span></label>
            <select name="branch" id="" class="form-control" required>
              <option value="" disabled selected>Select Branch</option>
              {% for branch in branches %}
              <option value="{{ branch.id }}">{{ branch.branch_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label>Date of Birth <span class="star">*</span></label>
            <input type="date" class="form-control" name="date_of_birth" required>
          </div>
          <div class="col-md-6">
            <label>Co-ordinator</label><br>
            <label><input type="radio" name="co_ordinator" value="True"> Yes</label>
            <label class="ms-3"><input type="radio" name="co_ordinator" value="False" checked> No</label>
          </div>
          
          <div class="row">

            <div class="col-md-6 mt-3 mb-3  ">
              <a href="{% url 'sales_person_list' %}" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center" style="transition: all 0.3s;">
                <i class="bi bi-arrow-left-circle me-2"></i> Back to List
              </a>
            </div>
            
            <div class="col-md-6 mt-3 mb-3">
              <button type="submit" class="btn btn-success w-100 d-flex align-items-center justify-content-center" style="transition: all 0.3s;">
                <i class="bi bi-check-circle me-2 "></i> Submit
              </button>
            </div>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>

</div>

    -webkit-background-clip: text;

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuItems = document.querySelectorAll('.sidebar ul li.has-submenu');
            menuItems.forEach(item => {
                item.addEventListener('click', function () {
                    const submenu = this.querySelector('.submenu');
                    const arrow = this.querySelector('.arrow-down');

                    // Hide all other submenus
                    menuItems.forEach(otherItem => {
                        if (otherItem !== this) {
                            const otherSubmenu = otherItem.querySelector('.submenu');
                            const otherArrow = otherItem.querySelector('.arrow-down');
                            if (otherSubmenu) {
                                otherSubmenu.style.display = 'none';
                                if (otherArrow.classList.contains('arrow-up')) {
                                    otherArrow.classList.remove('arrow-up');
                                }
                            }
                        }
                    });

                    // Toggle current submenu
                    if (submenu) {
                        submenu.style.display = (submenu.style.display === 'block' ? 'none' : 'block');
                        arrow.classList.toggle('arrow-up');
                    }
                });
            });
        });
        const deleteLinks = document.querySelectorAll('.delete-link');
        const confirmationModal = document.getElementById('confirmationModal');
        const confirmDeleteButton = document.getElementById('confirmDeleteButton');
        const cancelDeleteButton = document.getElementById('cancelDeleteButton');
        let deleteUrl = '';

        deleteLinks.forEach(link => {
            link.addEventListener('click', function (event) {
                event.preventDefault();
                deleteUrl = this.getAttribute('href');
                confirmationModal.style.display = 'block';
            });
        });

        confirmDeleteButton.addEventListener('click', function () {
            if (deleteUrl) {
                window.location.href = deleteUrl;
            }
        });

        cancelDeleteButton.addEventListener('click', function () {
            confirmationModal.style.display = 'none';
        });

        window.addEventListener('click', function (event) {
            if (event.target == confirmationModal) {
                confirmationModal.style.display = 'none';
            }
        });

        function openModal(service_id) {
            fetch(`/get_service_details/${service_id}/`)
                .then(response => response.text())
                .then(html => {
                    document.getElementById('modal-content').innerHTML = html;
                    document.getElementById('modal').classList.add('active');
                });

        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
    </script>

<script>
/* TEIM-VALIDATION: templates/add_sales_person.html */

(function(){
  var form = document.getElementById('spForm');
  if (!form) return;
  form.addEventListener('submit', function(e) {
    var errors = [];
    var fn = form.querySelector('[name="full_name"]');
    if (fn && !fn.value.trim()) errors.push('Full Name is required.');
    var mob = form.querySelector('[name="mobile_no"]');
    if (mob) {
      if (!mob.value.trim()) errors.push('Mobile No is required.');
      else if (!/^[0-9]{10}$/.test(mob.value.trim())) errors.push('Mobile No must be exactly 10 digits.');
    }
    var email = form.querySelector('[name="email"]');
    if (email && email.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim()))
      errors.push('Please enter a valid email address.');
    var branch = form.querySelector('[name="branch"]');
    if (branch && !branch.value) errors.push('Please select a Branch.');
    var pw = form.querySelector('[name="password"]');
    if (pw && !pw.value) errors.push('Password is required.');
    if (pw && pw.value && pw.value.length < 6) errors.push('Password must be at least 6 characters.');
    if (errors.length) {
      e.preventDefault();
      showErrors('spAlertBox', errors, form);
    }
  });
})();

</script>

<script>
function showErrors(boxId, errors, form) {
  var old = document.getElementById(boxId);
  if (old) old.remove();
  var d = document.createElement('div');
  d.id = boxId;
  d.className = 'alert alert-danger mt-2 mb-2';
  d.style.cssText = 'border-left:4px solid #dc3545; background:#fff5f5; padding:12px 16px;';
  d.innerHTML = '<strong style="color:#dc3545">&#9888; Please fix the following:</strong><ul class="mb-0 mt-1" style="padding-left:20px">' +
    errors.map(function(m){ return '<li style="margin-top:4px">' + m + '</li>'; }).join('') + '</ul>';
  form.insertBefore(d, form.firstChild);
  // Scroll the alert into view regardless of scroll container
  setTimeout(function() {
    d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}
</script>
</body>
