{% load static %}
{% load widget_tweaks %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Transfer Note</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
  {% include 'sidebar.html' %}
  <div class="container " style="margin-top: 130px;">

    <form method="post" data-destination-url="{% url 'load_destinations' %}"  data-batch-url="{% url 'load_batches' %}"
    data-source-id="{{ mtn.source_id|default:'' }}"
      data-destination-id="{{ mtn.destination_id|default:'' }}">
      {% csrf_token %}

      <!-- ================= MTN HEADER ================= -->
      <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold">
          Material Transfer Details
        </div>

        <div class="card-body">
          <div class="row g-3">

            <div class="col-md-3 destination-group">
              <label class="form-label">Source Type</label>
              <select class="form-select destination-type" name="source_type">
                <option value="">Select</option>
                <option value="BRANCH" {% if mtn.source_type == "BRANCH" %}selected{% endif %}>Branch</option>
                <option value="HO" {% if mtn.source_type == "HO" %}selected{% endif %}>Head Office</option>
                <option value="SITE" {% if mtn.source_type == "SITE" %}selected{% endif %}>Site</option>
              </select>
            </div>
            
            <div class="col-md-3 destination-group">
              <label class="form-label">Source</label>
              <select class="form-select destination-id" name="source">
                <option value="">Select Source</option>
              </select>
            </div>
            
            <div class="col-md-3 destination-group">
              <label class="form-label">Destination Type</label>
              <select class="form-select destination-type" name="destination_type">
                <option value="">Select</option>
                <option value="BRANCH" {% if mtn.destination_type == "BRANCH" %}selected{% endif %}>Branch</option>
                <option value="HO" {% if mtn.destination_type == "HO" %}selected{% endif %}>Head Office</option>
                <option value="SITE" {% if mtn.destination_type == "SITE" %}selected{% endif %}>Site</option>
              </select>
            </div>
            
            <div class="col-md-3 destination-group">
              <label class="form-label">Destination</label>
              <select class="form-select destination-id" name="destination">
                <option value="">Select Destination</option>
              </select>
            </div>
            

            <!-- Date -->
            <div class="col-md-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" name="date"  value="{{ mtn.transfer_date|date:'Y-m-d' }}">
            </div>

            <!-- Status -->
            <div class="col-md-3">
              <label class="form-label">Status</label>
              <select class="form-select" name="status">
                <option value="DRAFT" {% if mtn.status == "DRAFT" %}selected{% endif %}>Draft</option>
                <option value="APPROVED" {% if mtn.status == "APPROVED" %}selected{% endif %}>Approved</option>
                
              </select>
            </div>

            <!-- Remarks -->
            <div class="col-md-6">
              <label class="form-label">Remarks</label>
              <textarea class="form-control" name="remarks" rows="2"></textarea>
            </div>

          </div>
        </div>
      </div>

      <!-- ================= MTN ITEMS ================= -->
      <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold d-flex justify-content-between align-items-center">
          MTN Items
          <button type="button" class="btn btn-sm btn-success" id="addRowBtn">
            + Add Item
          </button>
        </div>
        

        <div class="card-body p-0">
          <table class="table table-bordered mb-0">
            <thead class="table-light">
              <tr>
                <th style="width:25%">Product</th>
                <th style="width:20%">Batch</th>
                <th style="width:10%">Qty</th>
                <th style="width:35%">Remarks</th>
                <th style="width:10%">Action</th>
              </tr>
            </thead>
<tbody id="mtnItemsBody">

  {% if is_edit %}
    {% for item in items %}
    <tr class="mtn-item-row">
      <td>
        <select class="form-select product-select" name="product[]" required>
          <option value="">Select Product</option>
          {% for prod in products %}
            <option value="{{ prod.product_id }}"
              {% if prod.product_id == item.product_id %}selected{% endif %}>
              {{ prod.product_name }}
            </option>
          {% endfor %}
        </select>
      </td>

      <td>
        <select class="form-select batch-select" name="batch[]">
          {% if item.batch %}
            <option value="{{ item.batch.id }}">{{ item.batch.batch }}</option>
          {% else %}
            <option value="">Select Batch</option>
          {% endif %}
        </select>
      </td>

      <td>
        <input type="number" class="form-control" name="qty[]"
               value="{{ item.transfer_qty }}" required>
      </td>

      <td>
        <input type="text" class="form-control" name="item_remarks[]"
               value="{{ item.remarks }}">
      </td>

      <td class="text-center">
        <button type="button" class="btn btn-danger btn-sm removeRowBtn">×</button>
      </td>
    </tr>
    {% endfor %}

  {% else %}
    <!-- ✅ CREATE MODE: ONE EMPTY ROW -->
    <tr class="mtn-item-row">
      <td>
        <select class="form-select product-select" name="product[]" required>
          <option value="">Select Product</option>
          {% for prod in products %}
            <option value="{{ prod.product_id }}">{{ prod.product_name }}</option>
          {% endfor %}
        </select>
      </td>

      <td>
        <select class="form-select batch-select" name="batch[]">
          <option value="">Select Batch</option>
        </select>
      </td>

      <td>
        <input type="number" class="form-control" name="qty[]" min="1" required>
      </td>

      <td>
        <input type="text" class="form-control" name="item_remarks[]">
      </td>

      <td class="text-center">
        <button type="button" class="btn btn-danger btn-sm removeRowBtn">×</button>
      </td>
    </tr>
  {% endif %}

</tbody>

              
            
          </table>
        </div>
      </div>

      <!-- ================= SUBMIT ================= -->
      <div class="text-end">
        <button type="submit" class="btn btn-primary px-4">
          Save MTN
        </button>
      </div>

    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
    
      document.querySelectorAll("form[data-destination-url]").forEach(form => {
    
        const url = form.dataset.destinationUrl;
        const sourceId = form.dataset.sourceId;
        const destinationId = form.dataset.destinationId;
    
        form.querySelectorAll(".destination-type").forEach(typeSelect => {
    
          // 🔹 Trigger automatically in EDIT mode
          if (typeSelect.name === "source_type" && typeSelect.value && sourceId) {
            loadDestinations(typeSelect, sourceId);
          }
          if (typeSelect.name === "destination_type" && typeSelect.value && destinationId) {
            loadDestinations(typeSelect, destinationId);
          }
    
          typeSelect.addEventListener("change", function () {
            loadDestinations(this, null);
          });
        });
    
        function loadDestinations(typeSelect, preselectId) {
          const typeGroup = typeSelect.closest(".destination-group");
          const destGroup = typeGroup.nextElementSibling;
          const destSelect = destGroup?.querySelector(".destination-id");
    
          if (!destSelect) return;
    
          destSelect.innerHTML = `<option value="">Select</option>`;
          if (!typeSelect.value) return;
    
          fetch(`${url}?destination_type=${typeSelect.value}`)
            .then(res => res.json())
            .then(data => {
              (data.results || []).forEach(item => {
                const opt = new Option(item.name, item.id);
                if (preselectId && String(item.id) === String(preselectId)) {
                  opt.selected = true;
                }
                destSelect.appendChild(opt);
              });
            });
        }
      });
    });
    </script>
    


<script>
  document.addEventListener("DOMContentLoaded", function () {
  
    const tbody = document.getElementById("mtnItemsBody");
    const addRowBtn = document.getElementById("addRowBtn");
    const form = document.querySelector("form");
    const batchUrl = form.dataset.batchUrl;
  
    // 🔹 Add new row
    addRowBtn.addEventListener("click", function () {
      const newRow = tbody.querySelector(".mtn-item-row").cloneNode(true);
  
      // reset values
      newRow.querySelector(".product-select").value = "";
      newRow.querySelector(".batch-select").innerHTML = `<option value="">Select Batch</option>`;
      newRow.querySelector('input[name="qty[]"]').value = "";
      newRow.querySelector('input[name="item_remarks[]"]').value = "";
  
      tbody.appendChild(newRow);
    });
  
    // 🔹 Remove row
    tbody.addEventListener("click", function (e) {
      if (e.target.classList.contains("removeRowBtn")) {
        if (tbody.querySelectorAll(".mtn-item-row").length > 1) {
          e.target.closest(".mtn-item-row").remove();
        }
      }
    });
  
    // 🔹 Load batch per product (row-wise)
    tbody.addEventListener("change", function (e) {
      if (e.target.classList.contains("product-select")) {
  
        const productId = e.target.value;
        if (!productId) return;
  
        const row = e.target.closest(".mtn-item-row");
        const batchSelect = row.querySelector(".batch-select");
  
        fetch(`${batchUrl}?product_id=${productId}`)
          .then(res => res.json())
          .then(data => {
            batchSelect.innerHTML = `<option value="">Select Batch</option>`;
            data.results.forEach(b => {
              batchSelect.insertAdjacentHTML(
                "beforeend",
                `<option value="${b.id}">${b.name}</option>`
              );
            });
          })
          .catch(err => console.error("Batch load error:", err));
      }
    });
  
  });
  </script>
  
  
    
</body>

</html>
