{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Delivery Challan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
{% include "sidebar.html" %}

<div class="container" style="margin-top:130px; max-width:900px;">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Edit Delivery Challan</h4>
    <span class="badge bg-success">DISPATCHED</span>
  </div>

  <!-- DC BASIC INFO -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">DC No</label>
          <input type="text" class="form-control" value="{{ dc.dc_no }}" disabled>
        </div>

        <div class="col-md-4">
          <label class="form-label">Delivery Date</label>
          <input type="text" class="form-control" value="{{ dc.delivery_date|date:'d-m-Y' }}" disabled>
        </div>

        <div class="col-md-4">
          <label class="form-label">Status</label>
          <input type="text" class="form-control" value="{{ dc.status }}" disabled>
        </div>
      </div>
    </div>
  </div>

  <!-- EDITABLE FORM -->
  <form method="post">
    {% csrf_token %}

    <div class="card shadow-sm">
      <div class="card-header fw-bold">
        Delivery Partner Details
      </div>

      <div class="card-body">
        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Delivery Partner Name</label>
            <input type="text"
                   name="delivery_partner_name"
                   class="form-control"
                   value="{{ dc.delivery_partner_name|default:'' }}"
                   placeholder="e.g. BlueDart / DTDC / Self">
          </div>

          <div class="col-md-6">
            <label class="form-label">Delivery Person Name</label>
            <input type="text"
                   name="delivery_person_name"
                   class="form-control"
                   value="{{ dc.delivery_person_name|default:'' }}"
                   placeholder="e.g. Ramesh">
          </div>

          <div class="col-md-6">
            <label class="form-label">Delivery Person Phone</label>
            <input type="text"
                   name="delivery_person_phone"
                   class="form-control"
                   value="{{ dc.delivery_person_phone|default:'' }}"
                   placeholder="10-digit mobile number">
          </div>

          <div class="col-md-12">
            <label class="form-label">Delivery Remarks</label>
            <textarea name="remarks"
                      class="form-control"
                      rows="3"
                      placeholder="Optional delivery notes">{{ dc.remarks|default:'' }}</textarea>
          </div>

        </div>
      </div>

      <div class="card-footer text-end">
        <a href="{% url 'dc_detail_view' dc.id %}" class="btn btn-secondary">
          Cancel
        </a>
        <button type="submit" class="btn btn-primary px-4">
          Update DC
        </button>
      </div>
    </div>

  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
