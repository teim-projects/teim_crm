{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Material Request</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        .card-header {
            font-weight: 600;
        }
        .remove-row {
            cursor: pointer;
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body class="bg-light">

{% include "sidebar.html" %}

<div class="container" style="margin-top:130px">

    <form method="post">
        {% csrf_token %}

        <!-- ================= HEADER ================= -->
        <div class="card shadow mb-4">
            <div class="card-header">
                Material Request
            </div>

            <div class="card-body row g-3">
                <div class="col-md-4">
                    <label class="form-label">Request Date</label>
                    <input type="text" class="form-control" value="{{ today|default:None }}" readonly>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Remarks</label>
                    <textarea name="remarks" class="form-control" rows="2"></textarea>
                </div>
            </div>
        </div>

        <!-- ================= PRODUCTS ================= -->
        <div class="card shadow mb-4">
            <div class="card-header d-flex justify-content-between">
                <span>Requested Materials</span>
                <button type="button" class="btn btn-sm btn-primary" onclick="addRow()">+ Add Product</button>
            </div>

            <div class="card-body p-0">
                <table class="table table-bordered m-0" id="itemsTable">
                    <thead class="table-light">
                        <tr>
                            <th width="55%">Product</th>
                            <th width="25%">Requested Qty</th>
                            <th width="10%">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <select name="product_id[]" class="form-select" required>
                                    <option value="">-- Select Product --</option>
                                    {% for p in products %}
                                        <option value="{{ p.product_id }}">{{ p.product_name }}</option>
                                    {% endfor %}
                                </select>
                            </td>
                            <td>
                                <input type="number" step="0.001" min="0" name="qty[]" class="form-control" required>
                            </td>
                            <td class="text-center">
                                <span class="remove-row" onclick="removeRow(this)">✖</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ================= ACTIONS ================= -->
        <div class="text-end">
            <button type="submit" class="btn btn-success">
                Submit Request
            </button>
            <a href="{% url 'material_request_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>
</div>

<script>
function addRow() {
    const table = document.getElementById("itemsTable").querySelector("tbody");
    const row = table.rows[0].cloneNode(true);

    row.querySelectorAll("input").forEach(i => i.value = "");
    row.querySelectorAll("select").forEach(s => s.selectedIndex = 0);

    table.appendChild(row);
}

function removeRow(el) {
    const tbody = document.getElementById("itemsTable").querySelector("tbody");
    if (tbody.rows.length > 1) {
        el.closest("tr").remove();
    }
}

// ─── SUBMIT VALIDATION ────────────────────────────────────
document.querySelector("form").addEventListener("submit", function(e) {
    const errors = [];
    const tbody = document.getElementById("itemsTable").querySelector("tbody");
    const rows = Array.from(tbody.querySelectorAll("tr"));
    const seenProducts = new Set();

    if (rows.length === 0) {
        errors.push("Please add at least one product.");
    }

    rows.forEach(function(row, idx) {
        const productSel = row.querySelector("select[name='product_id[]']");
        const qtyInput   = row.querySelector("input[name='qty[]']");

        const productVal = productSel ? productSel.value : "";
        const qtyVal     = qtyInput   ? parseFloat(qtyInput.value || 0) : 0;

        if (!productVal) {
            errors.push("Row " + (idx + 1) + ": Please select a Product.");
        } else {
            if (seenProducts.has(productVal)) {
                const productName = productSel.options[productSel.selectedIndex].text;
                errors.push("Duplicate product detected: '" + productName + "'. Please combine quantities into one row.");
            }
            seenProducts.add(productVal);
        }

        if (isNaN(qtyVal) || qtyVal <= 0) {
            errors.push("Row " + (idx + 1) + ": Requested quantity must be greater than 0.");
        }
    });

    if (errors.length > 0) {
        e.preventDefault();
        var old = document.getElementById("mrValidationAlert");
        if (old) old.remove();
        var alertDiv = document.createElement("div");
        alertDiv.id = "mrValidationAlert";
        alertDiv.className = "alert alert-danger mt-3";
        alertDiv.innerHTML = "<strong>Please fix the following:</strong><ul class='mb-0 mt-1'>" +
            errors.map(function(m){ return "<li>" + m + "</li>"; }).join("") + "</ul>";
        document.querySelector("form").prepend(alertDiv);
        alertDiv.scrollIntoView({ behavior: "smooth", block: "center" });
    }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
