{% load static %}
{% include 'sidebar.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TEIM CRM - Cancel AMC Contract</title>

    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .main {
            padding: 1.5rem 1rem;
        }

        .confirmation-card {
            max-width: 580px;
            margin: 100px auto 40px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .confirmation-header {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 2.5rem 1.5rem 2rem;
        }

        .warning-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .card-body {
            padding: 2.5rem 2rem;
        }

        .btn-danger {
            padding: 0.65rem 2.2rem;
            font-weight: 500;
        }

        .btn-secondary {
            padding: 0.65rem 2.2rem;
            font-weight: 500;
        }

        .contract-info {
            font-size: 1.1rem;
            margin: 1.5rem 0 2.5rem;
            line-height: 1.6;
        }

        @media (max-width: 576px) {
            .confirmation-card {
                margin: 80px 15px 30px;
            }
            .card-body {
                padding: 2rem 1.25rem;
            }
        }
    </style>
</head>

<body>

<div class="main">
    <div class="container">

        <div class="card confirmation-card shadow-lg">

            <div class="confirmation-header text-center">
                <i class="bi bi-exclamation-triangle-fill warning-icon"></i>
                <h3 class="fw-bold mb-2">Cancel AMC Contract</h3>
                <p class="mb-0 opacity-90">
                    This action cannot be undone
                </p>
            </div>

            <div class="card-body text-center">

                <p class="contract-info">
                    Are you sure you want to cancel contract<br>
                    <strong class="text-danger fs-5">{{ amc.contract_number }}</strong><br>
                    for customer<br>
                    <strong>{{ amc.customer.fullname }}</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}

                    <div class="d-flex justify-content-center gap-4 flex-wrap">
                        <a href="{% url 'amc:detail' amc.id %}"
                           class="btn btn-secondary px-5">
                            <i class="bi bi-arrow-left-circle me-2"></i>
                            No, Go Back
                        </a>

                        <button type="submit" class="btn btn-danger px-5">
                            <i class="bi bi-trash3 me-2"></i>
                            Yes, Cancel Contract
                        </button>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

</body>
</html>
