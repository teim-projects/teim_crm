<!DOCTYPE html>
<html>
<head>
    <title>AMC Renewal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 420px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .success { color: green; }
        .info { color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h2 class="success">AMC Update</h2>
        <p class="info">{{ message }}</p>
        <p style="margin-top:20px;font-size:13px;color:#666;">
            You may close this window.
        </p>
    </div>
</body>

</html>
