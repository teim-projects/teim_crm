{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Management Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/customer.css' %}">
    <script src="{% static 'js/script.js' %}"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0fbff;
            color: #333333;
        }


        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;


        }


        .card-registration {
            border-radius: 15px;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(3, 174, 210, 0.2);
            width: 100%;
            max-width: 700px;

            margin-top: 70px;
        }


        h3 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            color: #03AED2;
            margin-bottom: 30px;
        }

        .switch {
            position: relative;
            display: inline-block;
            margin-top: 10px;
            width: 55px;
            height: 26px;
        }


        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }


        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ffffff;
            transition: .4s;
            border-radius: 34px;
        }


        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }


        input:checked+.slider {
            background-color: #4caf50;
        }


        input:checked+.slider:before {
            transform: translateX(26px);
        }


        .gst-toggle-label {
            display: inline-block;
            margin-left: 10px;
            vertical-align: middle;
            margin-bottom: 35px;
        }


        .form-check {
            margin-bottom: 10px;
        }


        .form-check-input {
            margin-right: 10px;
        }


        #gst-price-container,
        #gst-number-container {
            display: none;
            /* Initially hidden, will show only when GST is checked */
        }

        /* Style for all form labels */
        label {
            font-family: 'Playfair Display', serif;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }


        /* General style for all input fields, select boxes, textareas */

        input[type="number"],
        input[type="password"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 10px;

            margin-bottom: 15px;

            border: 1px solid #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #ffffff;
        }




        input[type="number"],
        input[type="password"],
        input[type="url"],
        select,
        textarea {
            border-color: #878787;
            outline: none;
            box-shadow: 0 0 8px rgba(237, 237, 237, 0.2);
        }


        /* Style for select dropdowns */
        select {
            height: 40px;
            background-color: #fff;

        }


        /* Style for textarea to allow resizing vertically */










        /* Style for form wrapper to center form and add padding */
        form {
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
            padding: 10px;
            background-color: #ffffff;
        }


        /* Style for error messages */
        .error-message {
            color: red;
            font-size: 12px;
            margin-bottom: 10px;
        }





        /* Style for checkbox label */
        .form-check-label {
            margin-left: 5px;
            font-size: 14px;
        }





        .btn-info {
            background-color: #03AED2;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .btn-info:hover {
            background-color: #027994;
            box-shadow: 0 4px 15px rgba(3, 174, 210, 0.4);
        }

        @media (max-width: 768px) {
            .main-container {
                margin-top: 30px;
            }

            .card {
                margin-left: 0;

                max-width: 100%;
                /* Add some padding for better appearance */
            }

            .open-sidebar .card {

                margin-left: 300px;
                /* Adjust content when sidebar is open */
            }

        }


        .form-step {
            display: none;
        }

        .form-step:not(.d-none) {
            display: block;
        }

        .step-indicator.fw-bold {
            font-weight: bold;
            color: #0d6efd;
        }

        /* Toggle switch styling */
        .switch {
          position: relative;
          display: inline-block;
          width: 50px;
          height: 24px;
        }
        
        .switch input {
          opacity: 0;
          width: 0;
          height: 0;
        }
        
        .slider {
          position: absolute;
          cursor: pointer;
          background-color: #ccc;
          border-radius: 34px;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          transition: 0.4s;
        }
        
        .slider:before {
          position: absolute;
          content: "";
          height: 18px;
          width: 18px;
          left: 3px;
          bottom: 3px;
          background-color: white;
          border-radius: 50%;
          transition: 0.4s;
        }
        
        input:checked + .slider {
          background-color: #28a745;
        }
        
        input:checked + .slider:before {
          transform: translateX(26px);
        }
        
    </style>
</head>


<body>
    {% include 'sidebar.html' %}


    <div class="main-container">
        <div class="card shadow-2-strong card-registration">
            <div class="card-body">

                <span onclick="window.location.href='/index'"
                    style="float: left; cursor: pointer; color:rgb(75, 162, 255); font-size:20px;" class="mb-4"><i
                        class="fas fa-house-chimney"></i></span>
                <span onclick="goBackAndRefresh()" style="float: right; cursor: pointer; color:red; font-size:20px;"
                    class="mb-4">X</span>

                <h3 style="  font-weight: 600; margin: 10px;" class="mt-5">Service Management Record</h3>
                <form method="POST" id="service-management-form">
                    {% csrf_token %}



                    <!-- STEP 1: Customer & Services -->
                    <div class="form-step">
                        <!-- Customer Selection -->


                        <div class="row">
                            <div class="col-md-4">
                                <label>Customer Contact<span class="star">*</span></label>
                                <input type="text" id="customer_contact" name="customer_contact" required
                                    class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label>Customer Name<span class="star">*</span></label>
                                <input type="text" id="customer_full_name" name="customer_full_name" readonly required
                                    class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label>Customer Email<span class="star">*</span></label>
                                <input type="text" id="customer_email" name="customer_email" readonly required
                                    class="form-control">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-4 my-2 d-flex align-items-center">
                                <label class="me-2 mb-0">Apply GST</label>
                                <label class="switch mb-0">
                                    <input type="checkbox" id="apply_gst" name="apply_gst" onchange="toggleGST()">
                                    <span class="slider"></span>
                                </label>
                            </div>

                            <!-- Service Type -->
                             <div class="col-8">
                                 <label>Service Type<span class="star">*</span></label>
                                 <select id="servicetype" name="servicetype" class="form-control" onchange="fetchProducts(this)">
                                     <option value="">Select service types</option>
                                     {% for category, display_name in category_choices %}
                                     <option value="{{ category }}">{{ display_name }}</option>
                                     {% endfor %}
                                    </select>
                            </div>
                        </div>
                        <!-- Product Selection -->
                        <div class="row">
                            <label>Select Products</label>
                            <div id="products-container" >
                                <!-- Dynamically loaded via AJAX -->
                            </div>
                        </div>

                        <!-- Selected Services List -->
                        
                        <label>Selected Services</label>
                        <ul id="selected_services" class="selected-products-list"></ul>
                        <input type="hidden" id="selected_services_names" name="selected_services_names">
                        <div class="row">
                            <div class="col-5">
                                 <!-- Price Fields -->
                                 <label>Total Price (without GST)<span class="star">*</span></label>
                                 <input type="number" id="total_price" name="total_price" step="0.01" readonly
                                 class="form-control">
                            </div>
                            

                                <!-- GST Details -->
                                <div id="gst_fields" style="display: none;">
                                    <input type="text" name="gst_number" placeholder="Enter GST Number" class="form-control">
                                </div>
                           
                            <div class="col-3">
                                <label>GST</label>
                                <input type="number" id="gst_price" name="gst_price" step="0.01" readonly class="form-control">
                            </div>
                            <div class="col-4">
                                <label>Total Price (with GST)</label>
                                <input type="number" id="total_with_gst" name="total_with_gst" step="0.01" readonly
                                class="form-control">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12 text-center col-12">
                                <button type="button" class="btn btn-primary next-step mt-3"
                                    style="width: 150px;">Next</button>
                                <a href="/display_customer" class="btn btn-info mt-3" style="width: 150px;">View
                                    Records</a>

                            </div>
                        </div>
                    </div>

                    <!-- STEP 2: Contract & Property Details -->
                    <div class="form-step d-none">
                        <div class="row">
                            <div class="col-6">
                                <label>Contract Type<span class="star">*</span></label>
                                <select name="contract_type" class="form-control" required>
                                    <option value="One Time">One Time</option>
                                    <option value="AMC">AMC</option>
                                    <option value="Warranty">Warranty</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label>Contract Status<span class="star">*</span></label>
                                <select name="contract_status" class="form-control" required>
                                    <option value="Yes">Yes</option>
                                    <option value="No">No</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <label>Property Type<span class="star">*</span></label>
                                <textarea name="property_type" class="form-control" rows="1" required></textarea>
                            </div>
                            <div class="col-6">
                                <label for="warranty_period">Warranty Period<span class="star">*</span></label>
                                <input type="text" name="warranty_period" class="form-control" required><br>
                            </div>
                        </div>
                        <div class="row">

                            <div class="col-4">
                                <label for="state">State<span class="star">*</span></label>
                                <input type="text" id="state" name="state" required class="form-control">
                            </div>
                            
                            <div class="col-4">
                                <label>City<span class="star">*</span></label>
                                <input type="text" id="city" name="city" class="form-control" required><br>
                            </div>
                            <div class="col-4">
                                <label>Pincode<span class="star">*</span></label>
                                <input type="text" id="pincode" name="pincode" maxlength="6" class="form-control" required>
                            </div>
                        </div>

                        <label>Address<span class="star">*</span></label>
                        <textarea name="address" id="address" class="form-control" required></textarea>

                        <label>GPS Location<span class="star">*</span></label>
                        <input type="url" name="gps_location" class="form-control" required>


                        <div class="row">
                            <div class="col-md-12 text-center col-12">
                                <button type="button" class="btn btn-secondary prev-step mt-3"
                                    style="width: 150px;">Previous</button>

                                <button type="button" class="btn btn-primary next-step mt-3"
                                    style="width: 150px;">Next</button>

                            </div>
                        </div>
                    </div>

                    <!-- STEP 3: Sales & Delivery -->
                    <div class="form-step d-none">
                        <div class="row">
                            <div class="col-6">
                                <label>Select Frequency Count<span class="star">*</span></label>
                                <select name="frequency_count" class="form-control">
                                    {% for freq in frequency_choices %}
                                    <option value="{{ freq }}">{{ freq }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-6">
                                <label>Payment Terms<span class="star">*</span></label>
                                <input class="form-control" type="text" name="payment_terms"
                                value="100% Advance payment OR Whatever mutually Decided" readonly>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <label>Sales Person Name <span class="star">*</span></label>
                                <select name="sales_person_name" id="sales_person_select" class="form-control" required>
                                    <option value="">-- Select Sales Person --</option>
                                    {% for person in sales_persons %}
                                    <option value="{{ person.full_name }}" data-contact="{{ person.mobile_no }}">{{ person.full_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-6">
                                <label>Sales Person Contact No <span class="star">*</span></label>
                                <input type="text" id="sales_person_contact_no" name="sales_person_contact_no" class="form-control"
                                pattern="\d{10}" title="Please enter a valid 10-digit phone number" required readonly>
                            </div>
                        </div>

                        <label>Delivery Time<span class="star">*</span></label>
                        <input type="time" class="form-control" name="delivery_time" required>

                        <label>Lead Date<span class="star">*</span></label>
                        <input type="date" name="lead_date" class="form-control" required>

                        <label>Service Date<span class="star">*</span></label>
                        <input type="date" name="service_date" class="form-control" required>

                        <div class="row">
                            <div class="col-md-12 text-center col-12">
                                <button type="button" class="btn btn-secondary prev-step mt-3"
                                    style="width: 150px;">Previous</button>


                                <button class="btn btn-info mt-3" type="submit" style="width:150px;">Submit</button>
                            </div>

                        </div>
                        <div class="mt-4 pt-2 text-center">
                        </div>

                    </div>
                </form>



            </div>
        </div>
    </div>



    <!-- Change to your actual view -->




    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuItems = document.querySelectorAll('.sidebar ul li.has-submenu');
            menuItems.forEach(item => {
                item.addEventListener('click', function () {
                    const submenu = this.querySelector('.submenu');
                    const arrow = this.querySelector('.arrow-down');

                    // Hide all other submenus
                    menuItems.forEach(otherItem => {
                        if (otherItem !== this) {
                            const otherSubmenu = otherItem.querySelector('.submenu');
                            const otherArrow = otherItem.querySelector('.arrow-down');
                            if (otherSubmenu) {
                                otherSubmenu.style.display = 'none';
                                if (otherArrow.classList.contains('arrow-up')) {
                                    otherArrow.classList.remove('arrow-up');
                                }
                            }
                        }
                    });


                    // Toggle current submenu
                    if (submenu) {
                        submenu.style.display = (submenu.style.display === 'block' ? 'none' : 'block');
                        arrow.classList.toggle('arrow-up');
                    }
                });
            });
        });
    </script>

    <!-- sales contact autofill -->
     <script>
    document.addEventListener("DOMContentLoaded", function () {
        const select = document.getElementById("sales_person_select");
        const contactInput = document.getElementById("sales_person_contact_no");

        select.addEventListener("change", function () {
            const selectedOption = this.options[this.selectedIndex];
            const contact = selectedOption.getAttribute("data-contact") || '';
            contactInput.value = contact;
        });
    });
</script>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const contactInput = document.getElementById("customer_contact");
            const nameInput = document.getElementById("customer_full_name");
            const emailInput = document.getElementById("customer_email");
            const cityInput = document.getElementById("city");
            const stateInput = document.getElementById("state");
            const pincodeInput = document.getElementById("pincode");
            const addressInput = document.getElementById("address");

            contactInput.addEventListener('blur', function () {
                const contactNo = contactInput.value.trim();
                if (!contactNo) return;

                fetch(`/get_customer_details/?contact_no=${encodeURIComponent(contactNo)}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Customer not found');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.error) {
                            alert(data.error);
                            return;
                        }

                        if (data.customer_email) {
                            emailInput.value = data.customer_email;
                        }
                        if (data.customer_full_name) {
                            nameInput.value = data.customer_full_name;
                        }
                        if (data.city) {
                            cityInput.value = data.city;
                        }
                        if (data.pincode) {
                            pincodeInput.value = data.pincode;
                        }
                        if (data.shifttopartyaddress) {
                            addressInput.value = data.shifttopartyaddress;
                        }
                        if (data.state) {
                            stateInput.value = data.state;
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            });
        });
    </script>

  
   <script>
        let selectedProducts = [];
        let totalPrice = 0;
        const GST_RATE = 0;
        function fetchProducts(selectElement) {
            const selectedCategories = Array.from(selectElement.selectedOptions).map(option => option.value);
            if (selectedCategories.length === 0) return;
                
            const categoriesQuery = selectedCategories.join(',');
                
            fetch(`/get_products?categories=${categoriesQuery}`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('products-container');
                
                    // Get all currently rendered product elements
                    const allProductDivs = Array.from(container.children);
                
                    // Remove products NOT selected and NOT part of selectedProducts
                    allProductDivs.forEach(div => {
                        const checkbox = div.querySelector('input[name="selected_services"]');
                        const productId = checkbox?.value;
                        const isSelected = selectedProducts.some(p => p.id === productId);
                        const isInNewData = data.products.some(p => String(p.product_id) === productId);
                    
                        if (!isSelected && !isInNewData) {
                            container.removeChild(div);
                        }
                    });
                
                    // Get currently rendered product IDs
                    const renderedProductIds = Array.from(container.querySelectorAll('input[name="selected_services"]'))
                        .map(input => input.value);
                
                    // Render only new products
                    data.products.forEach(product => {
                        const productId = String(product.product_id);
                    
                        if (renderedProductIds.includes(productId)) return;
                    
                        const existing = selectedProducts.find(p => p.id === productId);
                        const isChecked = existing ? 'checked' : '';
                        const displayDesc = existing ? 'block' : 'none';
                    
                        const productDiv = document.createElement('div');
                      productDiv.innerHTML = `
                            <div class="mb-2 border rounded p-2">
                                <!-- Product Name in One Row -->
                                <div class="row align-items-center mb-1">
                                    <div class="col-auto">
                                        <input type="checkbox" name="selected_services" value="${productId}"
                                            data-price="${product.price}" data-name="${product.product_name}"
                                            ${isChecked}
                                            onchange="updateSelectedServices(this)">
                                    </div>
                                    <div class="col">
                                        <strong>${product.product_name}</strong>
                                    </div>
                                </div>
                            
                                <!-- Other Fields in Another Row -->
                                <div class="row g-2 align-items-center">
                                    <div class="col-md-3">
                                        <input type="number" class="form-control form-control-sm product-price-input"
                                            data-product-id="${productId}"
                                            value="${existing ? existing.price : product.price}"
                                            placeholder="Price"
                                            name="price_${productId}"
                                            step="0.01"
                                            onchange="updateProductPrice(this, '${productId}')">
                                    </div>
                                    <div class="col-md-2">
                                        <input type="number" class="form-control form-control-sm product-quantity-input"
                                            data-product-id="${productId}"
                                            name="quantity_${productId}"
                                            value="${existing ? existing.quantity : product.quantity}"
                                            placeholder="Quantity"
                                            step="0.01"
                                            onchange="updateProductQuantity(this, '${productId}')">
                                    </div>
                                    <div class="col-md-2">
                                        <input type="number" class="form-control form-control-sm product-gst-input"
                                            name="gst_${productId}"
                                            data-product-id="${productId}"
                                            value="${existing ? existing.gst : product.gst}"
                                            placeholder="GST %"
                                            step="0.01"
                                            onchange="updateProductGst(this, '${productId}')">
                                    </div>
                                    <div class="col-md-5">
                                        <textarea class="form-control form-control-sm description-input"
                                            data-product-id="${productId}"
                                            name="description_${productId}"
                                            oninput="updateProductDescription(this, '${productId}')"
                                            placeholder="Description"
                                            style="resize: none;">${existing ? existing.description : ''}</textarea>
                                    </div>
                                </div>
                            </div>
                            `;

                        container.appendChild(productDiv);
                    });
                
                    updateSelectedServicesList();
                    updateTotalPrice();
                })
                .catch(error => {
                    console.error('Error fetching products:', error);
                });
        }


        function updateSelectedServices(checkbox) {
            const productId = checkbox.value;
            const productName = checkbox.getAttribute('data-name');
            const priceInput = document.querySelector(`input[data-product-id="${productId}"].product-price-input`);
            const gstInput = document.querySelector(`input[data-product-id="${productId}"].product-gst-input`)
            const quantityInput = document.querySelector(`input[data-product-id="${productId}"].product-quantity-input`);
            const descriptionInput = document.querySelector(`textarea[data-product-id="${productId}"]`);
            const descContainer = document.getElementById(`desc-container-${productId}`);

            const productPrice = parseFloat(priceInput.value) || 0;
            const productQuantity = parseFloat(quantityInput.value) || 0;
            const description = descriptionInput?.value || '';

            if (checkbox.checked) {
                if (descContainer) descContainer.style.display = 'block';

                // Avoid duplicates
                const alreadyAdded = selectedProducts.find(p => p.id === productId);
                if (!alreadyAdded) {
                    selectedProducts.push({
                        id: productId,
                        name: productName,
                        price: productPrice,
                        quantity: productQuantity,
                        description: description,
                        gst: parseFloat(gstInput.value) || 0 
                    });
                }
            } else {
                if (descContainer) descContainer.style.display = 'none';
                if (descriptionInput) descriptionInput.value = '';

                selectedProducts = selectedProducts.filter(product => product.id !== productId);
            }

            console.log('Updated Selected Products:', selectedProducts);
            updateSelectedServicesList();
            updateTotalPrice();
        }



        function updateSelectedServicesList() {
            const selectedServicesList = document.getElementById('selected_services');
            const selectedServicesNamesInput = document.getElementById('selected_services_names');

            selectedServicesList.innerHTML = ''; // Clear the list
            let selectedServiceNames = [];

            selectedProducts.forEach(product => {
                const listItem = document.createElement('li');
                const gstEnabled = document.getElementById('apply_gst').checked;
                const gstAmount = gstEnabled ? ` + GST(${product.gst}%)` : '';
                listItem.textContent = `${product.name}: Rs. ${product.price} x ${product.quantity}${gstAmount}`;

                selectedServicesList.appendChild(listItem);
                selectedServiceNames.push(product.name); // Collecting product names
            });

            selectedServicesNamesInput.value = selectedServiceNames.join(',');

            if (selectedProducts.length === 0) {
                const emptyMessage = document.createElement('li');
                emptyMessage.textContent = 'No products selected';
                selectedServicesList.appendChild(emptyMessage);
            }
        }

        function updateTotalPrice() {
            totalPrice = selectedProducts.reduce((total, product) => total + product.price * product.quantity, 0);
            const totalPriceInput = document.getElementById('total_price');
            totalPriceInput.value = totalPrice.toFixed(2);

            if (document.getElementById('apply_gst').checked) {
                applyGST();
            } else {
                clearGSTFields();
            }
        }

        function updateProductDescription(textarea, productId) {
            const newDescription = textarea.value;

            selectedProducts.forEach(product => {
                if (product.id === productId) {
                    product.description = newDescription;
                }
            });

            updateSelectedServicesList();
        }


      function toggleGST() {
        const isGSTApplied = document.getElementById('apply_gst').checked;
        const gstContainer = document.getElementById('gst-fields-container');

        if (isGSTApplied) {
            applyGST();
            gstContainer.style.display = 'block';
        } else {
            clearGSTFields();
            gstContainer.style.display = 'none';
        }
        }

       function applyGST() {
            let gstTotal = 0;
            selectedProducts.forEach(product => {
                const price = product.price || 0;
                const quantity = product.quantity || 1;
                const gstRate = (product.gst || 0) / 100;  // Convert % to decimal
                gstTotal += price * quantity * gstRate;
            });
        
            const gstPriceInput = document.getElementById('gst_price');
            const totalWithGSTInput = document.getElementById('total_with_gst');
        
            const totalWithGST = totalPrice + gstTotal;
        
            gstPriceInput.value = gstTotal.toFixed(2);
            totalWithGSTInput.value = totalWithGST.toFixed(2);
        }


        function clearGSTFields() {
            document.getElementById('gst_price').value = '';
            document.getElementById('total_with_gst').value = '';
        }

        function updateProductPrice(priceInput, productId) {
            const newPrice = parseFloat(priceInput.value) || 0; // Handle invalid input gracefully
            selectedProducts.forEach(product => {
                if (product.id === productId) {
                    product.price = newPrice;
                }
            });
            updateSelectedServicesList();
            updateTotalPrice();
        }
        function updateProductGst(gstInput, productId) {
            const newGst = parseFloat(gstInput.value) || 0; // Handle invalid input gracefully
            selectedProducts.forEach(product => {
                if (product.id === productId) {
                    product.gst = newGst;
                }
            });
            updateSelectedServicesList();
            updateTotalPrice();
        }
        function updateProductQuantity(quantityInput, productId) {
            // Fetch the new quantity from the input field
            const newQuantity = parseFloat(quantityInput.value) || 1; // Default to 1 if invalid or empty

            // Update the quantity in the selectedProducts array
            selectedProducts.forEach(product => {
                if (product.id === productId) {
                    product.quantity = newQuantity;
                }
            });

            // Debug log to verify the updated quantity
            console.log(`Updated Quantity for Product ID ${productId}:`, newQuantity);

            // Update the list of selected services and total price
            updateSelectedServicesList();
            updateTotalPrice();
        }

        function updateCustomerDetails() {
            const customerSelect = document.getElementById("customer_id");
            const selectedOption = customerSelect.options[customerSelect.selectedIndex];

            const contact = selectedOption.getAttribute("data-contact");
            const email = selectedOption.getAttribute("data-email");

            document.getElementById("customer_contact").value = contact || '';
            document.getElementById("customer_email").value = email || '';
        }

    </script>

    <script>
        const steps = document.querySelectorAll(".form-step");
        const nextBtns = document.querySelectorAll(".next-step");
        const prevBtns = document.querySelectorAll(".prev-step");
        const indicators = document.querySelectorAll(".step-indicator"); // If you added step indicators

        let currentStep = 0;

        function showStep(index) {
            steps.forEach((step, i) => {
                step.classList.toggle("d-none", i !== index);
            });
            indicators.forEach((indicator, i) => {
                indicator.classList.toggle("active", i === index);
            });
        }

        nextBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                if (currentStep < steps.length - 1) {
                    currentStep++;
                    showStep(currentStep);
                }
            });
        });

        prevBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                if (currentStep > 0) {
                    currentStep--;
                    showStep(currentStep);
                }
            });
        });

        // Init on load
        showStep(currentStep);
    </script>
