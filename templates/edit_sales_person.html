<!DOCTYPE html>
<html lang="en">

<head>
  <title>TEIMCRM</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="css/style.css" rel="stylesheet">
  <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

  <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<style>
  .form-rowsales{
  margin: 85px 10px 10px 10px !important;
/* top | right | bottom | left */

  }
</style>
</head>

<body>
      {% include 'sidebar.html' %}
<div class="main">
  
 <div class="container">
  <div class="row form-rowsales">


    <div class="col-md-8 offset-md-2 shadow bg-white  rounded  p-2">
           <span onclick="window.location.href='/index'"
                    style="float: left; cursor: pointer; color:rgb(75, 162, 255); font-size:20px;" class="mb-4"><i
                        class="fas fa-house-chimney ml-2 mt-1"></i></span>
                <span onclick="goBackAndRefresh()" style="float: right; cursor: pointer; color:red; font-size:20px;"
                    class="mb-4 mr-2 mt-1">X</span>
      <form method="post" class="p-3" id="editSpForm" novalidate>
        {% csrf_token %}
        
        <div class="row">
              <div class="col-md-12">
      <h3 class="text-center text-dark ">Update Sales Person</h3>
    </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Full Name <span class="star">*</span></label>
            <input type="text" name="full_name" class="form-control" value="{{ person.full_name }}" required>
          </div>
          
          <div class="col-md-6 mb-3">
            <label class="form-label">Mobile No <span class="star">*</span></label>
            <input type="text" name="mobile_no" class="form-control" value="{{ person.mobile_no }}" required maxlength="10" pattern="[0-9]{10}" title="Enter exactly 10 digits" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Email <span class="star">*</span></label>
            <input type="email" name="email" class="form-control" value="{{ person.email }}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label>Branch <span class="star">*</span></label>
            <select name="branch" id="" class="form-control" required>
              <option value="" disabled selected>Select Branch</option>
              {% for branch in branches %}
              <option value="{{ branch.id }}" 
              {% if branch.id == person.branch.id %}
                selected
              {% endif %}
                >{{ branch.branch_name }}</option>
              {% endfor %}
            </select>
          </div>
            <div class="col-md-3 mb-3 form-group">
                <label for="password">Password (leave blank to keep unchanged):</label>
                <input type="password" name="password" class="form-control" id="password">
            </div>
            <div class="col-md-3">
              <label>Co-ordinator</label><br>
              <label><input type="radio" name="co_ordinator" value="True" 
              {% if person.co_ordinator %}
                checked
              {% endif %}
                > Yes</label>
              <label class="ms-3"><input type="radio" name="co_ordinator" value="False" 
              {% if not person.co_ordinator %}
                checked
              {% endif %}
                > No</label>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Date of Joining <span class="star">*</span></label>
                <input type="date" name="date_of_joining" class="form-control" value="{{ person.date_of_joining|date:'Y-m-d' }}" required>
              </div>
          <div class="col-md-3 mb-3">
            <label class="form-label">Date of Birth <span class="star">*</span></label>
            <input type="date" name="date_of_birth" class="form-control"  value="{{ person.date_of_birth|date:'Y-m-d' }}" required>
          </div>
          <!-- <div class="col-md-6"></div> -->
<div class="row">
          <div class="col-md-6 mt-3 mb-3  ">
            <a href="{% url 'sales_person_list' %}" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center" style="transition: all 0.3s;">
              <i class="bi bi-arrow-left-circle me-2"></i> Back to List
            </a>
        </div>

        <div class="col-md-6 mt-3 mb-3">
             <button type="submit" class="btn btn-primary w-100 d-flex align-items-center justify-content-center" style="transition: all 0.3s;">
                Update
             </button>
        </div>
</div>
        </div>
      </form>
    </div>
  </div>
</div>

</div>

    <div class="container-fluid footer  " style="background-color: #f7f7f7; width:100%; margin-top:200px;">
        <div class="row p-3">
            <div class="col-md-12 text-center">
                <p style="margin: 0; font-weight: 600; word-wrap: break-word;color:#000000">
                    © 2025. Powered by
                    <img src="{% static 'images/crono.png' %}" alt="Chronoanalytics Logo"
                        style="height: 20px; vertical-align: middle;">
                    <a href="http://www.chronoanalytics.in/"
                        style="text-decoration: none;  background: linear-gradient(to right, #2575fc, #6a11cb);-webkit-background-clip: text;-webkit-text-fill-color: transparent; font-size: 1.1rem;">Chronoanalytics
                        Solution</a>
                    All Rights Reserved.
                </p>
            </div>
            <div class="col-md-12 text-center">
                <p style="font-weight: 600; word-wrap: break-word;color:#000000 ">
                    © 2025. Marketed by
                    <img src="{% static 'images/TeimLogo.png' %}" alt="Teim Logo"
                        style="height: 20px; vertical-align: middle;">
                    <a href="http://teim.in/" style="text-decoration: none;  background: linear-gradient(to right, #2575fc, #6a11cb); /* Gradient definition */
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; font-size: 1.1rem;">TEIM</a>
                    All Rights Reserved.
                </p>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuItems = document.querySelectorAll('.sidebar ul li.has-submenu');
            menuItems.forEach(item => {
                item.addEventListener('click', function () {
                    const submenu = this.querySelector('.submenu');
                    const arrow = this.querySelector('.arrow-down');

                    // Hide all other submenus
                    menuItems.forEach(otherItem => {
                        if (otherItem !== this) {
                            const otherSubmenu = otherItem.querySelector('.submenu');
                            const otherArrow = otherItem.querySelector('.arrow-down');
                            if (otherSubmenu) {
                                otherSubmenu.style.display = 'none';
                                if (otherArrow.classList.contains('arrow-up')) {
                                    otherArrow.classList.remove('arrow-up');
                                }
                            }
                        }
                    });

                    // Toggle current submenu
                    if (submenu) {
                        submenu.style.display = (submenu.style.display === 'block' ? 'none' : 'block');
                        arrow.classList.toggle('arrow-up');
                    }
                });
            });
        });
        const deleteLinks = document.querySelectorAll('.delete-link');
        const confirmationModal = document.getElementById('confirmationModal');
        const confirmDeleteButton = document.getElementById('confirmDeleteButton');
        const cancelDeleteButton = document.getElementById('cancelDeleteButton');
        let deleteUrl = '';

        deleteLinks.forEach(link => {
            link.addEventListener('click', function (event) {
                event.preventDefault();
                deleteUrl = this.getAttribute('href');
                confirmationModal.style.display = 'block';
            });
        });

        confirmDeleteButton.addEventListener('click', function () {
            if (deleteUrl) {
                window.location.href = deleteUrl;
            }
        });

        cancelDeleteButton.addEventListener('click', function () {
            confirmationModal.style.display = 'none';
        });

        window.addEventListener('click', function (event) {
            if (event.target == confirmationModal) {
                confirmationModal.style.display = 'none';
            }
        });

        function openModal(service_id) {
            fetch(`/get_service_details/${service_id}/`)
                .then(response => response.text())
                .then(html => {
                    document.getElementById('modal-content').innerHTML = html;
                    document.getElementById('modal').classList.add('active');
                });

        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
    </script>

<script>
function showErrors(boxId, errors, form) {
  var old = document.getElementById(boxId);
  if (old) old.remove();
  var d = document.createElement('div');
  d.id = boxId;
  d.className = 'alert alert-danger mt-2 mb-2';
  d.style.cssText = 'border-left:4px solid #dc3545;background:#fff5f5;padding:12px 16px;';
  d.innerHTML = '<strong style="color:#dc3545">&#9888; Please fix the following:</strong>' +
    '<ul class="mb-0 mt-1" style="padding-left:20px">' +
    errors.map(function(m){ return '<li style="margin-top:4px">'+m+'</li>'; }).join('') + '</ul>';
  form.insertBefore(d, form.firstChild);
  setTimeout(function(){ d.scrollIntoView({behavior:'smooth',block:'start'}); }, 50);
}
</script>
<script>
(function(){
  document.addEventListener('DOMContentLoaded', function(){
    var form = document.getElementById('editSpForm');
    if (!form) return;
    form.addEventListener('submit', function(e) {
      var errors = [];
      var fn = form.querySelector('[name="full_name"]');
      if (fn && !fn.value.trim()) errors.push('Full Name is required.');
      var mob = form.querySelector('[name="mobile_no"]');
      if (mob) {
        if (!mob.value.trim()) errors.push('Mobile No is required.');
        else if (!/^[0-9]{10}$/.test(mob.value.trim())) errors.push('Mobile No must be exactly 10 digits.');
      }
      var email = form.querySelector('[name="email"]');
      if (email && email.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim()))
        errors.push('Please enter a valid email address.');
      var branch = form.querySelector('[name="branch"]');
      if (branch && !branch.value) errors.push('Please select a Branch.');
      if (errors.length) { e.preventDefault(); showErrors('editSpAlertBox', errors, form); }
    });
  });
})();
</script>
</body>

</html>
